<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golem — AI-native programming language</title>
<meta name="description" content="Golem is an AI-native programming language for LLMs. Source extension .gol. Brand: golemlang.">
<style>
  :root { --bg:#0e1116; --txt:#d7dde5; --dim:#8a94a3; --acc:#5eb1ff; --line:#2a323d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:
    radial-gradient(ellipse 80% 50% at 50% -20%, #1a3048 0%, transparent 55%),
    var(--bg); color:var(--txt);
    font:16px/1.55 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:72px 24px 80px; }
  h1 { font-size:48px; letter-spacing:-0.03em; margin:0 0 8px; }
  .tag { color:var(--dim); font-size:14px; text-transform:uppercase; letter-spacing:.12em; margin-bottom:28px; }
  p.lead { font-size:20px; line-height:1.45; margin:0 0 28px; max-width:34em; }
  .meta { color:var(--dim); font-size:14px; margin-bottom:36px; }
  .meta code { color:var(--acc); }
  .actions { display:flex; flex-wrap:wrap; gap:12px; }
  a.btn { display:inline-block; padding:10px 16px; border-radius:8px; text-decoration:none;
    border:1px solid var(--line); color:var(--txt); }
  a.btn.primary { background:var(--acc); color:#0a1220; border-color:var(--acc); font-weight:600; }
  a.btn:hover { filter:brightness(1.08); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">golemlang · .gol</div>
    <h1>Golem</h1>
    <p class="lead">An AI-native programming language designed for LLMs to generate, edit, verify, and reason about programs — not for humans as the primary authors.</p>
    <p class="meta">Canonical form is a typed semantic graph. Source files use <code>.gol</code>. Site/package brand: <code>golemlang</code>.</p>
    <div class="actions">
      <a class="btn primary" href="https://github.com/mattschinkel/GolemLang">GitHub</a>
      <a class="btn" href="dashboard.html">Build dashboard</a>
      <a class="btn" href="https://github.com/mattschinkel/GolemLang/blob/master/README.md">README</a>
    </div>
  </div>
</body>
</html>
