<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knot - Build Dashboard</title>
<!--
  Knot (working name) - one-page build dashboard.
  Owner: R6 Scribe.  Plain HTTP or file://.  No HTTPS.
  HOW AGENTS UPDATE: edit only the STATUS object in the <script>. The
  page re-renders from it. Do not hand-edit <div id="app">.
  Status values: "done" | "in-progress" | "pending" | "blocked"
-->
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232c;--line:#2a323d;
    --txt:#d7dde5;--dim:#8a94a3;--acc:#5eb1ff;--ok:#3fb950;--warn:#d29922;
    --bad:#f85149;--purple:#a371f7;--teal:#39d0d8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5
    -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
  header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;
    justify-content:space-between;border-bottom:1px solid var(--line);
    padding-bottom:14px;margin-bottom:22px}
  header.top h1{margin:0;font-size:22px}
  header.top h1 .wk{color:var(--dim);font-weight:400}
  .meta{font-size:12px;color:var(--dim);text-align:right}
  .meta b{color:var(--txt)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
  .full{grid-column:1/-1}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--dim)}
  .pill.done{color:var(--ok);border-color:var(--ok);background:#0d1f12}
  .pill.in-progress{color:var(--warn);border-color:var(--warn);background:#1f1a0d}
  .pill.pending{color:var(--dim)}
  .pill.blocked{color:var(--bad);border-color:var(--bad);background:#1f0d0d}
  .pill.open{color:var(--warn);border-color:var(--warn);background:#1f1a0d}
  .pill.decided{color:var(--ok);border-color:var(--ok);background:#0d1f12}
  table{width:100%;border-collapse:collapse}
  td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.num{color:var(--dim);width:34px;font-variant-numeric:tabular-nums}
  td.owner{color:var(--acc);white-space:nowrap;width:96px}
  .row:hover{background:var(--panel2)}
  .crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .agent{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .agent .id{font-weight:700;color:var(--purple)}
  .agent .id .on{color:var(--ok);font-size:11px;margin-left:6px}
  .agent .id .off{color:var(--dim);font-size:11px;margin-left:6px}
  .agent .role{font-size:12px}
  .agent .job{font-size:11px;color:var(--dim);margin-top:3px}
  ul{margin:6px 0;padding-left:18px}
  li{margin:6px 0}
  .mono{color:var(--acc);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .namebar .k{color:var(--warn);font-weight:700}
  .namebar .n{color:var(--ok);font-weight:700}
  .bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-top:8px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--teal))}
  footer{margin-top:26px;color:var(--dim);font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Knot <span class="wk">- AI-native language build dashboard</span></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="grid" id="app"></div>
  <footer id="foot"></footer>
</div>
<script>
const STATUS = {
  meta: {
    workingName: "Knot",
    publicCandidate: "Nodigma",
    overallPhase: "§16 build complete (Phases 0–12)",
    overallStatus: "done",
    lastUpdated: "2026-09-12",
    updatedBy: "Cursor"
  },
  phases: [
    {n:0, name:"Core data model", status:"done", owner:"R2", notes:"value/type repr, units/dimensions, errors-as-values; 38 tests green"},
    {n:1, name:"AST + parser + GBNF grammar", status:"done", owner:"R2/R3", notes:"D-FB1–5: DEF/FN[[]], GET-only, T@dim, holes; 321+ tests"},
    {n:2, name:"Type checker", status:"done", owner:"R2", notes:"T1–T18: unify→check_expr, props, drift gate PASS; T10–T18 mostly manual"},
    {n:3, name:"Effects / capabilities / contracts", status:"done", owner:"Cursor", notes:"T1–T12 done manually; 4B crew abandoned; 414 tests; drift phase 3"},
    {n:4, name:"Holes + partial compile", status:"done", owner:"Cursor", notes:"VALID/PARTIAL/INVALID, hole reports, expected= prop, M4=1.0; 439 tests"},
    {n:5, name:"Structured errors + repairs", status:"done", owner:"Cursor", notes:"ERR AST, diagnose+repairs, canonical print; 460 tests"},
    {n:6, name:"Edit operations", status:"done", owner:"Cursor", notes:"apply_edit REPLACE/DELETE/INSERT/RENAME/REPLACE_MATCH; blast radius"},
    {n:7, name:"Tests / properties", status:"done", owner:"Cursor", notes:"TEST/PROPERTY AIR, fuzz_samples, verify_program"},
    {n:8, name:"Modules + dependencies", status:"done", owner:"Cursor", notes:"MODULE/IMPORT/DEPENDS + link_program + caps"},
    {n:9, name:"Compiler / VM (sub-200ms)", status:"done", owner:"Cursor", notes:"bytecode VM; M5 pass; deterministic lowering"},
    {n:10, name:"AI / tool capabilities", status:"done", owner:"Cursor", notes:"MODEL/TOOL/INVOKE, AiResult, constrain, caps"},
    {n:11, name:"Concurrency / memory / unsafe", status:"done", owner:"Cursor", notes:"PAR/SEQ, REF/DEREF, UNSAFE, RegionType"},
    {n:12, name:"MCP server + kb + --llm mode", status:"done", owner:"Cursor", notes:"tools + kb + llm_out; python -m knot; no HTTPS"}
  ],
  crew: [
    {id:"R1", role:"Architect", active:false, job:"design coherence (docs); not driving build via 4B"},
    {id:"R2", role:"Kernel Engineer", active:false, job:"superseded by Cursor implementation"},
    {id:"R3", role:"AI Front-end Engineer", active:false, job:"GBNF, repairs, MCP, --llm, kb (judgment half)"},
    {id:"R4", role:"Verifier", active:false, job:"pytest + drift gate run by Cursor"},
    {id:"R5", role:"DX Engineer", active:false, job:"formatter, LSP, CLI, sub-200ms loop"},
    {id:"R6", role:"Scribe", active:true, job:"docs, dashboard, name_changes/fixes (via Cursor)"}
  ],
  openQuestions: [
    {q:"Phase 0 host language: Python or Rust?", status:"decided", dec:"Python (Rust deferred if sub-200ms forces it — VM path landed Phase 9)"},
    {q:"Architect (R1) as a hierarchical Crew manager, or a peer that drafts tasks out-of-band?", status:"decided", dec:"Peer drafting out-of-band (4B loses coherence managing live)"},
    {q:"Shell-execution tool: agents run builds/tests directly, or gate every shell call behind human approval?", status:"decided", dec:"Autonomous: agents run whitelisted build/test commands directly"},
    {q:"Repo layout: src/knot/, src/knot/ai/, tests/, cli/, lsp/, fmt/, grammar/ - confirm or amend?", status:"decided", dec:"Confirmed; vm implemented under src/knot/vm/"},
    {q:"Canonical syntax toward 10/10 (external review 8.5→10)?", status:"decided", dec:"D-FB1–12 locked; through Phase 9 landed"},
    {q:"Build driver: 4B CrewAI vs Cursor?", status:"decided", dec:"Cursor implements; 4B crew abandoned 2026-09-11"}
  ],
  recentFixes: [
    {file:"phase12_spec.md + mcp/", problem:"Need MCP + kb + --llm", fix:"Phase 12: tools, kb budget, llm_out, python -m knot"},
    {file:"phase11_spec.md + concurrency.py", problem:"Need PAR/SEQ/regions/unsafe", fix:"Phase 11: dataflow eval, RegionVal, UNSAFE caps"},
    {file:"phase10_spec.md + ai_ffi.py", problem:"Need MODEL/TOOL/INVOKE + confidence", fix:"Phase 10: ToolRegistry, AiResult, constrain"},
    {file:"phase9_spec.md + src/knot/vm/", problem:"Need bytecode VM + M5", fix:"Phase 9: compile/run stack VM; M5 baseline 50ms"}
  ],
  designOpen: [
    {q:"Node ID scheme", status:"decided", dec:"structural path + optional @label; numeric IDs compiler-internal (design 21)"},
    {q:"Public name", status:"open", dec:"working name Knot (collides); Nodigma verified clean, not yet registered"},
    {q:"GBNF/parser reopen for D-FB1–5", status:"decided", dec:"Landed through Phase 12 (§16 complete)"}
  ],
  drift: {
    phase: 12,
    gate: "pass",
    note: "Phase 12 baseline: M1–M5 unchanged; MCP/kb/--llm landed. §16 build complete.",
    metrics: [
      {m:"M1 token count",       status:"pass", better:"lower",  prereq:"Phase 1 (parser)"},
      {m:"M2 generation accuracy",status:"pass", better:"higher", prereq:"Phase 1 (GBNF)"},
      {m:"M3 edit round-trip",    status:"pass", better:"higher", prereq:"Phase 1 (pretty+parser)"},
      {m:"M4 partial-compile",   status:"pass", better:"higher", prereq:"Phase 4"},
      {m:"M5 compile latency",    status:"pass", better:"lower",  prereq:"Phase 9 (VM)"}
    ]
  },
  specLint: {
    phase: 12,
    gate: "pass",
    note: "tools/spec_lint.py - deterministic, no LLM.",
    rules: [
      {r:"R1 status",      desc:"autonomous, not stale / 'for human review' / 'implemented' with unchecked DoD"},
      {r:"R2 numbering",   desc:"## N. headings strictly increasing from 1 (no 0-restart)"},
      {r:"R3 dod boxes",   desc:"DoD checkboxes unchecked while the spec is a draft"},
      {r:"R4 invariants",  desc:"no D contradicts 21 (numeric IDs compiler-internal; canon = bracket notation)"},
      {r:"R5 sections",    desc:"Scope, Design decisions, File layout, Definition of done, Resolved sub-questions"}
    ]
  }
};

function pill(s){return '<span class="pill '+s+'">'+s+'</span>'}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function render(){
  const m=STATUS.meta;
  document.getElementById("meta").innerHTML =
    "Overall: <b>"+pill(m.overallStatus)+"</b><br>"+esc(m.overallPhase)+
    "<br>Updated <b>"+esc(m.lastUpdated)+"</b> by <b>"+esc(m.updatedBy)+"</b>";

  const done=STATUS.phases.filter(p=>p.status==="done").length;
  const pct=Math.round(done/STATUS.phases.length*100);
  let app="<div class='card full'><h2>Name</h2>"+
    "<div class='namebar'>Working name: <span class='k'>"+esc(m.workingName)+"</span>"+
    " (collides - not for release) &nbsp;|&nbsp; Public candidate: <span class='n'>"+
    esc(m.publicCandidate)+"</span> (verified clean, not yet registered)</div></div>";

  app+="<div class='card full'><h2>Build phases (design 16) - "+done+"/"+STATUS.phases.length+" done</h2>"+
    "<div class='bar'><i style='width:"+pct+"%'></i></div>"+
    "<table><tr><th>#</th><th>Phase</th><th>Owner</th><th>Status</th><th>Notes</th></tr>";
  STATUS.phases.forEach(p=>{
    app+="<tr class='row'><td class='num'>"+p.n+"</td><td>"+esc(p.name)+"</td>"+
      "<td class='owner'>"+esc(p.owner)+"</td><td>"+pill(p.status)+"</td>"+
      "<td style='color:var(--dim)'>"+esc(p.notes||"")+"</td></tr>";
  });
  app+="</table></div>";

  app+="<div class='card'><h2>Active crew</h2><div class='crew'>";
  STATUS.crew.forEach(a=>{
    app+="<div class='agent'><div class='id'>"+esc(a.id)+" "+
      (a.active?"<span class='on'>ACTIVE</span>":"<span class='off'>idle</span>")+
      "</div><div class='role'>"+esc(a.role)+"</div><div class='job'>"+esc(a.job)+"</div></div>";
  });
  app+="</div></div>";

  app+="<div class='card'><h2>Open questions (knot_agents 5)</h2><ul class='q'>";
  STATUS.openQuestions.forEach(q=>{
    app+="<li><span class='qq'>"+esc(q.q)+"</span> "+pill(q.status)+"</li>";
  });
  app+="</ul></div>";

  app+="<div class='card'><h2>Design open items</h2><ul class='q'>";
  STATUS.designOpen.forEach(q=>{
    app+="<li><span class='qq'>"+esc(q.q)+"</span> "+pill(q.status)+
    (q.dec?"<br><span class='dec'>"+esc(q.dec)+"</span>":"")+"</li>";
  });
  app+="</ul></div>";

  app+="<div class='card'><h2>Spec-consistency gate (agents 8 step 1)</h2>"+
    "<div style='margin-bottom:8px'>Phase "+esc(STATUS.specLint.phase)+": "+
    pill(STATUS.specLint.gate)+"<br><span style='color:var(--dim)'>"+
    esc(STATUS.specLint.note)+"</span></div>"+
    "<table><tr><th>Rule</th><th>Checks</th></tr>";
  STATUS.specLint.rules.forEach(s=>{
    app+="<tr class='row'><td class='mono'>"+esc(s.r)+"</td><td style='color:var(--dim)'>"+
      esc(s.desc)+"</td></tr>";
  });
  app+="</table></div>";

  app+="<div class='card'><h2>Drift-check gate (agents 8)</h2>"+
    "<div style='margin-bottom:8px'>Phase "+esc(STATUS.drift.phase)+": "+
    pill(STATUS.drift.gate)+"<br><span style='color:var(--dim)'>"+
    esc(STATUS.drift.note)+"</span></div>"+
    "<table><tr><th>Metric</th><th>Better</th><th>Status</th><th>Prereq</th></tr>";
  STATUS.drift.metrics.forEach(d=>{
    app+="<tr class='row'><td>"+esc(d.m)+"</td><td style='color:var(--dim)'>"+
      esc(d.better)+"</td><td>"+pill(d.status)+"</td><td style='color:var(--dim)'>"+
      esc(d.prereq)+"</td></tr>";
  });
  app+="</table></div>";

  app+="<div class='card full'><h2>Recent fixes</h2><ul class='fixes'>";
  STATUS.recentFixes.forEach(f=>{
    app+="<li><span class='f'>"+esc(f.file)+"</span> - "+esc(f.problem)+
    " -> "+esc(f.fix)+"</li>";
  });
  app+="</ul></div>";

  document.getElementById("app").innerHTML=app;
  document.getElementById("foot").textContent=
    "Knot build dashboard - maintained by R6 Scribe. Edit the STATUS object in "+
    "web/index.html to update. Plain HTTP only (no HTTPS).";
}
render();
</script>
</body>
</html>
